<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inner Groove Brewing – DJ Request Night</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0d; font-family: 'DM Sans', sans-serif; color: #f0f0f0; }
    :root {
      --bg:        #0d0d0d;
      --surface:   #161616;
      --card:      #1e1e1e;
      --border:    #2e2e2e;
      --green:     #6dc135;
      --green-dim: #4a8a22;
      --green-glow:rgba(109,193,53,.25);
      --white:     #ffffff;
      --muted:     #6b6b6b;
      --gold:      #f5c842;
      --red:       #e63946;
      --text:      #f0f0f0;
      --font-display: 'Bebas Neue', sans-serif;
      --font-mono:    'Space Mono', monospace;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    @keyframes pulse-green {
      0%,100% { text-shadow: 0 0 10px var(--green), 0 0 30px var(--green-dim); }
      50%      { text-shadow: 0 0 4px var(--green-dim); }
    }
    @keyframes slide-up {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes ticker {
      from { transform: translateX(100vw); }
      to   { transform: translateX(-100%); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const SUPABASE_URL  = "https://gyrfthjhacvoyhfilnjc.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5cmZ0aGpoYWN2b3loZmlsbmpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMTE1MjMsImV4cCI6MjA4ODU4NzUyM30.cI2df-xYe2X-LzC2L4mrtbuhWasAR7tAEOi9qSY9_rM";
    const VENMO_HANDLE  = "@InnerGrooveBrewing";

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    function sortQueue(q) {
      const bumped = [...q.filter(s => s.bumped)].sort((a, b) => b.tip - a.tip);
      return [...bumped, ...q.filter(s => !s.bumped)];
    }

    async function fetchQueue() {
      const { data } = await sb.from("dj_queue").select("*").order("order_index", { ascending: true }).order("created_at", { ascending: true });
      return data || [];
    }

    async function fetchSettings() {
      const { data } = await sb.from("dj_settings").select("settings").eq("id", "singleton").single();
      return data ? data.settings : null;
    }

    async function persistSettings(s) {
      await sb.from("dj_settings").update({ settings: s, updated_at: new Date().toISOString() }).eq("id", "singleton");
    }

    // ── Patron View ────────────────────────────────────────────────────────────
    // ── Payment Screen ─────────────────────────────────────────────────────────
    function PaymentScreen({ amount, label, songTitle, action, paymentMethods, onDone }) {
      const pm = paymentMethods || {};

      const actionLabel = action === "bump_up" ? "Bump Up" : action === "bury" ? "Bury It" : "Request";
      const note = action === "bump_up"
        ? `Bump+Up+${encodeURIComponent(songTitle)}`
        : action === "bury"
          ? `Bury+${encodeURIComponent(songTitle)}`
          : `DJ+${label}+for+${encodeURIComponent(songTitle)}`;

      const methods = [
        pm.venmo?.enabled   && { key:"venmo",   label:"Venmo",   color:"#3d95ce", emoji:"💸", url:`https://venmo.com/${pm.venmo.handle.replace(/^@/,"")}?txn=pay&amount=${amount.toFixed(2)}&note=${note}` },
        pm.paypal?.enabled  && { key:"paypal",  label:"PayPal",  color:"#003087", emoji:"🅿️",  url:`https://www.paypal.com/paypalme/${pm.paypal.handle.replace(/^@/,"")}/${amount.toFixed(2)}` },
        pm.cashapp?.enabled && { key:"cashapp", label:"Cash App", color:"#00d64f", emoji:"💚", url:`https://cash.app/${pm.cashapp.handle}/${amount.toFixed(2)}` },
        pm.zelle?.enabled   && { key:"zelle",   label:"Zelle",   color:"#6d1ed4", emoji:"⚡", url:`https://enroll.zellepay.com/qr-codes?data=${encodeURIComponent(JSON.stringify({name:"Inner Groove Brewing",token:pm.zelle.handle}))}` },
        pm.cash?.enabled    && { key:"cash",    label:"Cash",    color:"#4a8a22", emoji:"🫙",  url:null },
      ].filter(Boolean);

      return (
        <div style={{ minHeight:"100vh", background:"var(--bg)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:32, textAlign:"center" }}>
          <div style={{ fontFamily:"var(--font-display)", fontSize:52, color:"var(--green)", letterSpacing:6, animation:"pulse-green 3s ease-in-out infinite", lineHeight:1 }}>INNER GROOVE</div>
          <div style={{ fontFamily:"var(--font-display)", fontSize:28, color:"var(--green-dim)", letterSpacing:8, marginBottom:24 }}>BREWING</div>
          <div style={{ fontSize:48, marginBottom:8 }}>🎉</div>
          <h2 style={{ fontFamily:"var(--font-display)", fontSize:36, color:"var(--green)", letterSpacing:3, marginBottom:8 }}>
            {action === "request" ? "REQUEST SUBMITTED!" : actionLabel.toUpperCase() + "!"}
          </h2>
          <p style={{ color:"var(--muted)", marginBottom:28, lineHeight:1.6, maxWidth:320 }}>
            <strong style={{ color:"var(--text)" }}>{songTitle}</strong>
            {action === "request" ? " is in the queue." : " has been updated."}
            {amount > 0 && <> Send <strong style={{ color:"var(--gold)" }}>${amount.toFixed(2)}</strong> to complete your {label.toLowerCase()}!</>}
          </p>

          {amount > 0 && methods.length > 0 && (
            <div style={{ width:"100%", maxWidth:340, display:"flex", flexDirection:"column", gap:10, marginBottom:20 }}>
              <div style={{ fontFamily:"var(--font-mono)", fontSize:11, color:"var(--muted)", letterSpacing:2, marginBottom:4 }}>HOW WOULD YOU LIKE TO PAY?</div>
              {methods.map(m => (
                m.url ? (
                  <a key={m.key} href={m.url} target="_blank" rel="noreferrer"
                    style={{ display:"flex", alignItems:"center", gap:14, background:m.color, color:"#fff", fontWeight:700, fontSize:16, padding:"14px 20px", borderRadius:12, textDecoration:"none" }}>
                    <span style={{ fontSize:22 }}>{m.emoji}</span>
                    <span>Pay with {m.label}</span>
                    <span style={{ marginLeft:"auto", opacity:.7 }}>→</span>
                  </a>
                ) : (
                  <div key={m.key} onClick={() => onDone()}
                    style={{ display:"flex", alignItems:"center", gap:14, background:"rgba(74,138,34,.15)", border:"1px solid var(--green)", color:"var(--green)", fontWeight:600, fontSize:15, padding:"14px 20px", borderRadius:12, cursor:"pointer", textAlign:"left", userSelect:"none" }}>
                    <span style={{ fontSize:22 }}>🫙</span>
                    <div>
                      <div>Drop ${amount.toFixed(2)} in the tip jar</div>
                      <div style={{ fontSize:12, color:"var(--green-dim)", fontWeight:400, marginTop:2 }}>Tap to confirm — honor system! 🤘</div>
                    </div>
                  </div>
                )
              ))}
            </div>
          )}

          <button onClick={onDone}
            style={{ background:"transparent", border:"1px solid var(--border)", color:"var(--muted)", borderRadius:8, padding:"10px 24px", cursor:"pointer", fontSize:14, marginTop:8 }}>
            {action === "request" ? "Submit another request" : "← Back to queue"}
          </button>
        </div>
      );
    }

        function PatronView({ queue, onRefresh, settings, onSettingsChange }) {
      const [step, setStep]     = useState("form");
      const [song, setSong]     = useState("");
      const [artist, setArtist] = useState("");
      const [name, setName]     = useState("");
      const [tip, setTip]       = useState("");
      const [bump, setBump]     = useState(false);
      const [message, setMessage] = useState("");
      const [error, setError]   = useState("");
      const [saving, setSaving] = useState(false);
      const [selectedSong, setSelectedSong] = useState(null);
      const [actionType, setActionType]     = useState(null);
      const [actionTip, setActionTip]       = useState("");
      const [actionName, setActionName]     = useState("");
      const [actionSaving, setActionSaving] = useState(false);
      const [pendingPayment, setPendingPayment] = useState(null);

      const label = settings.charityMode ? "Donation" : settings.donationLabel;
      const allowFree = settings.charityMode ? false : settings.allowFree;
      const TIP_PRESETS = allowFree ? [0, 2, 5, 10] : [2, 5, 10];
      const tipAmt = parseFloat(tip) || 0;

      async function handleBumpAction() {
        if (!actionName.trim()) return;
        const actionTipAmt = parseFloat(actionTip) || 0;
        if (actionTipAmt <= 0) return;
        setActionSaving(true);
        if (actionType === "up") {
          await sb.from("dj_queue").update({
            bumped: true,
            tip: (selectedSong.tip || 0) + actionTipAmt,
            last_action: "bump_up",
          }).eq("id", selectedSong.id);
        } else {
          const { data } = await sb.from("dj_queue").select("order_index").order("order_index", { ascending: false }).limit(1);
          const maxIdx = data && data.length > 0 ? (data[0].order_index || 0) + 1 : 999;
          await sb.from("dj_queue").update({ order_index: maxIdx, last_action: "bury" }).eq("id", selectedSong.id);
        }
        // Log to donations_log
        await sb.from("donations_log").insert({
          id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
          donor_name: actionName.trim(),
          amount: actionTipAmt,
          song_id: selectedSong.id,
          song_title: selectedSong.song,
          action: actionType === "up" ? "bump_up" : "bury",
        });
        await onRefresh();
        setActionSaving(false);
        // Track charity raised
        if (settings.charityMode) {
          onSettingsChange(s => ({ ...s, charityRaised: (s.charityRaised || 0) + actionTipAmt }));
        }
        // Show payment screen
        setPendingPayment({
          amount: actionTipAmt,
          songTitle: selectedSong.song,
          action: actionType === "up" ? "bump_up" : "bury",
        });
        setSelectedSong(null); setActionType(null); setActionTip(""); setActionName("");
      }

      function handleSubmit() {
        if (!song.trim()) { setError("Song title is required."); return; }
        if (!name.trim()) { setError("Your name is required."); return; }
        if (!allowFree && tipAmt <= 0) { setError(`A ${label.toLowerCase()} is required to submit a request.`); return; }
        // Duplicate detection
        const duplicate = queue.find(s => s.song.trim().toLowerCase() === song.trim().toLowerCase());
        if (duplicate) { setError(`"${duplicate.song}" is already in the queue — tap it below to bump it instead!`); return; }
        // Request cap
        if (settings.requestCap > 0) {
          const existing = queue.filter(s => s.name.trim().toLowerCase() === name.trim().toLowerCase());
          if (existing.length >= settings.requestCap) { setError(`You've already submitted ${settings.requestCap} song${settings.requestCap > 1 ? "s" : ""} — the limit for tonight. Tip on an existing request instead!`); return; }
        }
        setError(""); setStep("confirm");
      }

      async function handleConfirm() {
        setSaving(true);
        const { data: existing } = await sb.from("dj_queue").select("order_index").order("order_index", { ascending: false }).limit(1);
        const nextIdx = existing && existing.length > 0 ? (existing[0].order_index || 0) + 1 : 0;
        const newId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        const { error: err } = await sb.from("dj_queue").insert({
          id: newId, song: song.trim(), artist: artist.trim(),
          name: name.trim(), tip: tipAmt, bumped: bump, order_index: nextIdx,
          last_action: bump ? "bump_up" : null,
          message: message.trim() || null,
        });
        if (!err && tipAmt > 0) {
          await sb.from("donations_log").insert({
            id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
            donor_name: name.trim(), amount: tipAmt,
            song_id: newId, song_title: song.trim(),
            action: bump ? "bump_up" : "request",
          });
          if (settings.charityMode) {
            onSettingsChange(s => ({ ...s, charityRaised: (s.charityRaised || 0) + tipAmt }));
          }
        }
        setSaving(false);
        if (err) { setError("Something went wrong. Try again."); setStep("form"); return; }
        await onRefresh();
        setStep("payment");
      }

      const inp = {
        background:"var(--surface)", border:"1px solid var(--border)",
        borderRadius:8, padding:"12px 16px", color:"var(--text)",
        fontSize:16, width:"100%", outline:"none",
        fontFamily:"'DM Sans', sans-serif",
      };

      if (step === "payment") return (
        <PaymentScreen
          amount={tipAmt}
          label={label}
          songTitle={song}
          action="request"
          paymentMethods={settings.paymentMethods}
          onDone={() => { setSong(""); setArtist(""); setName(""); setTip(""); setBump(false); setMessage(""); setStep("form"); }}
        />
      );

      if (step === "confirm") return (
        <div style={{ minHeight:"100vh", background:"var(--bg)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:24 }}>
          <div style={{ width:"100%", maxWidth:420, animation:"slide-up .3s ease" }}>
            <h2 style={{ fontFamily:"var(--font-display)", fontSize:40, color:"var(--green)", letterSpacing:3, marginBottom:24, textAlign:"center" }}>CONFIRM REQUEST</h2>
            <div style={{ background:"var(--card)", border:"1px solid var(--border)", borderRadius:16, padding:24, marginBottom:24 }}>
              {[["Song",song],["Artist",artist||"—"],["Your Name",name],[`${label} Amount`,tipAmt>0?`$${tipAmt.toFixed(2)}`:`No ${label.toLowerCase()}`],["Jump the Line?",bump?"✅ Yes":"No"],...(message.trim()?[["Message 💌",message]]:[])].map(([k,v]) => (
                <div key={k} style={{ display:"flex", justifyContent:"space-between", padding:"10px 0", borderBottom:"1px solid var(--border)" }}>
                  <span style={{ color:"var(--muted)", fontSize:14 }}>{k}</span>
                  <span style={{ fontWeight:600, color:k==="Tip Amount"?"var(--gold)":"var(--text)" }}>{v}</span>
                </div>
              ))}
            </div>
            {tipAmt > 0 && <p style={{ color:"var(--muted)", fontSize:13, textAlign:"center", marginBottom:20, lineHeight:1.5 }}>After confirming you'll be redirected to Venmo. Honor system — thanks for keeping it real! 🤘</p>}
            <div style={{ display:"flex", gap:12 }}>
              <button onClick={() => setStep("form")} style={{ flex:1, background:"transparent", border:"1px solid var(--border)", color:"var(--muted)", borderRadius:10, padding:14, cursor:"pointer", fontSize:15 }}>← Back</button>
              <button onClick={handleConfirm} disabled={saving}
                style={{ flex:2, background:"var(--green)", color:"#0d0d0d", borderRadius:10, padding:14, cursor:"pointer", fontSize:16, fontWeight:700, border:"none", opacity:saving?0.7:1 }}>
                {saving ? "Submitting…" : "Submit Request 🎵"}
              </button>
            </div>
          </div>
        </div>
      );

      return (
        <div style={{ minHeight:"100vh", background:"var(--bg)", display:"flex", flexDirection:"column", alignItems:"center", padding:"32px 20px" }}>
          <div style={{ textAlign:"center", marginBottom:28 }}>
            <div style={{ fontFamily:"var(--font-display)", fontSize:56, color:"var(--green)", letterSpacing:5, animation:"pulse-green 3s ease-in-out infinite", lineHeight:1 }}>INNER GROOVE</div>
            <div style={{ fontFamily:"var(--font-display)", fontSize:30, color:"var(--green-dim)", letterSpacing:8, marginTop:2, marginBottom:6 }}>BREWING</div>
            <div style={{ fontFamily:"var(--font-display)", fontSize:14, color:"var(--muted)", letterSpacing:6 }}>DJ REQUEST NIGHT</div>
          </div>
          <div style={{ width:"100%", maxWidth:420, display:"flex", flexDirection:"column", gap:16, paddingBottom:80 }}>
            <div>
              <label style={{ display:"block", fontSize:11, letterSpacing:2, color:"var(--muted)", textTransform:"uppercase", marginBottom:6, fontFamily:"var(--font-mono)" }}>Song Title *</label>
              <input value={song} onChange={e => setSong(e.target.value)} placeholder="Bohemian Rhapsody" style={inp} />
            </div>
            <div>
              <label style={{ display:"block", fontSize:11, letterSpacing:2, color:"var(--muted)", textTransform:"uppercase", marginBottom:6, fontFamily:"var(--font-mono)" }}>Artist</label>
              <input value={artist} onChange={e => setArtist(e.target.value)} placeholder="Queen" style={inp} />
            </div>
            <div>
              <label style={{ display:"block", fontSize:11, letterSpacing:2, color:"var(--muted)", textTransform:"uppercase", marginBottom:6, fontFamily:"var(--font-mono)" }}>Your Name *</label>
              <input value={name} onChange={e => setName(e.target.value)} placeholder="Taylor" style={inp} />
            </div>
            <div>
              <label style={{ display:"block", fontSize:11, letterSpacing:2, color:"var(--muted)", textTransform:"uppercase", marginBottom:6, fontFamily:"var(--font-mono)" }}>Message / Dedication <span style={{ color:"var(--muted)", fontSize:10, letterSpacing:1 }}>(optional · DJ only)</span></label>
              <input value={message} onChange={e => setMessage(e.target.value)} placeholder="This one's for my wife — happy anniversary! 🎉" style={{ ...inp, fontSize:14 }} />
            </div>
            <div>
              <label style={{ display:"block", fontSize:11, letterSpacing:2, color:"var(--muted)", textTransform:"uppercase", marginBottom:6, fontFamily:"var(--font-mono)" }}>{label} Amount{!allowFree && <span style={{color:"var(--red)"}}> *</span>}</label>
              <div style={{ display:"flex", gap:8, marginBottom:8 }}>
                {TIP_PRESETS.map(p => (
                  <button key={p} onClick={() => setTip(p===0?"":String(p))}
                    style={{
                      flex:1, padding:"10px 0", borderRadius:8, cursor:"pointer", fontSize:14, fontWeight:600,
                      border:`1px solid ${(parseFloat(tip)||0)===p?"var(--green)":"var(--border)"}`,
                      background:(parseFloat(tip)||0)===p?"rgba(109,193,53,.15)":"var(--surface)",
                      color:(parseFloat(tip)||0)===p?"var(--green)":"var(--muted)",
                    }}>{p===0?`No ${label.toLowerCase()}`:`$${p}`}</button>
                ))}
              </div>
              <input type="number" min="0" step="0.50" value={tip} onChange={e => setTip(e.target.value)}
                placeholder="or enter custom amount" style={{ ...inp, fontSize:15 }} />
            </div>
            {tipAmt > 0 && settings.bumpUpEnabled && (
              <div onClick={() => setBump(!bump)}
                style={{
                  background:bump?"rgba(109,193,53,.1)":"var(--surface)",
                  border:`1px solid ${bump?"var(--green)":"var(--border)"}`,
                  borderRadius:12, padding:"16px 20px", cursor:"pointer",
                  display:"flex", alignItems:"center", justifyContent:"space-between",
                }}>
                <div>
                  <div style={{ fontWeight:600, fontSize:15, color:bump?"var(--green)":"var(--text)" }}>⚡ Jump the Line</div>
                  <div style={{ fontSize:12, color:"var(--muted)", marginTop:2 }}>Use your {label.toLowerCase()} to move up in the queue</div>
                </div>
                <div style={{
                  width:24, height:24, borderRadius:"50%",
                  border:`2px solid ${bump?"var(--green)":"var(--border)"}`,
                  background:bump?"var(--green)":"transparent",
                  display:"flex", alignItems:"center", justifyContent:"center",
                }}>{bump && <span style={{ fontSize:12, color:"#0d0d0d" }}>✓</span>}</div>
              </div>
            )}
            {error && <div style={{ color:"var(--red)", fontSize:13, padding:"8px 12px", background:"rgba(230,57,70,.1)", borderRadius:8, border:"1px solid rgba(230,57,70,.3)" }}>{error}</div>}
            <button onClick={handleSubmit}
              style={{
                background:"var(--green)", color:"#0d0d0d", border:"none",
                borderRadius:12, padding:18, fontSize:18, fontWeight:700,
                cursor:"pointer", fontFamily:"var(--font-display)", letterSpacing:3,
                marginTop:8, boxShadow:"0 0 28px rgba(109,193,53,.35)",
              }}>
              PREVIEW REQUEST →
            </button>
            {queue.length > 0 && (
              <div style={{ marginTop:8 }}>
                <div style={{ fontSize:11, letterSpacing:2, color:"var(--muted)", textTransform:"uppercase", fontFamily:"var(--font-mono)", marginBottom:10 }}>
                  Current Queue ({queue.length}){(settings.bumpUpEnabled||settings.bumpDownEnabled) && <span style={{ marginLeft:8, color:"var(--green)" }}>· tap to bump</span>}
                </div>
                {queue.slice(0,6).map((s,i) => (
                  <div key={s.id}
                    onClick={() => { if(settings.bumpUpEnabled||settings.bumpDownEnabled){ setSelectedSong(s); setActionType(null); setActionTip(""); setActionName(""); }}}
                    style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 8px", borderBottom:"1px solid var(--border)", borderRadius:6, cursor:(settings.bumpUpEnabled||settings.bumpDownEnabled)?"pointer":"default", transition:"background .15s" }}
                    onMouseEnter={e => e.currentTarget.style.background="rgba(255,255,255,.03)"}
                    onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                    <span style={{ fontFamily:"var(--font-mono)", fontSize:12, color:i===0?"var(--green)":"var(--muted)", minWidth:20 }}>{i+1}</span>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:14, fontWeight:500, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{s.song}</div>
                      <div style={{ fontSize:12, color:"var(--muted)" }}>{s.name}{s.artist?` · ${s.artist}`:""}</div>
                    </div>
                    {s.bumped && <span style={{ fontSize:10, color:"var(--green)", border:"1px solid var(--green)", borderRadius:4, padding:"2px 6px", fontFamily:"var(--font-mono)" }}>⚡</span>}
                    {(settings.bumpUpEnabled||settings.bumpDownEnabled) && <span style={{ fontSize:16, color:"var(--muted)" }}>›</span>}
                  </div>
                ))}
                {queue.length > 6 && <div style={{ fontSize:12, color:"var(--muted)", textAlign:"center", padding:"8px 0" }}>+{queue.length-6} more</div>}
              </div>
            )}

            {/* Payment Screen for bump/bury */}
            {pendingPayment && (
              <div style={{ position:"fixed", inset:0, zIndex:9999, background:"var(--bg)" }}>
                <PaymentScreen
                  amount={pendingPayment.amount}
                  label={label}
                  songTitle={pendingPayment.songTitle}
                  action={pendingPayment.action}
                  paymentMethods={settings.paymentMethods}
                  onDone={() => setPendingPayment(null)}
                />
              </div>
            )}

            {/* Bump/Bury Modal */}
            {selectedSong && (
              <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.8)", display:"flex", alignItems:"flex-end", justifyContent:"center", zIndex:9999, padding:"0 0 0 0" }}
                onClick={e => { if(e.target===e.currentTarget){ setSelectedSong(null); setActionType(null); }}}>
                <div style={{ background:"var(--card)", border:"1px solid var(--border)", borderRadius:"20px 20px 0 0", padding:28, width:"100%", maxWidth:480, animation:"slide-up .25s ease" }}>
                  <div style={{ fontFamily:"var(--font-mono)", fontSize:11, color:"var(--muted)", letterSpacing:2, marginBottom:4 }}>SELECTED</div>
                  <div style={{ fontWeight:700, fontSize:18, marginBottom:4 }}>{selectedSong.song}</div>
                  <div style={{ fontSize:13, color:"var(--muted)", marginBottom:20 }}>{selectedSong.name}{selectedSong.artist?` · ${selectedSong.artist}`:""}</div>

                  {!actionType ? (
                    <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                      {settings.bumpUpEnabled && (
                        <button onClick={() => setActionType("up")}
                          style={{ background:"rgba(109,193,53,.1)", border:"1px solid var(--green)", color:"var(--green)", borderRadius:12, padding:"14px 20px", cursor:"pointer", fontSize:15, fontWeight:600, textAlign:"left", display:"flex", alignItems:"center", gap:12 }}>
                          <span style={{ fontSize:20 }}>⬆️</span>
                          <div>
                            <div>Bump Up</div>
                            <div style={{ fontSize:12, color:"var(--green-dim)", fontWeight:400 }}>Add a {label.toLowerCase()} to move this song earlier</div>
                          </div>
                        </button>
                      )}
                      {settings.bumpDownEnabled && (
                        <button onClick={() => setActionType("down")}
                          style={{ background:"rgba(230,57,70,.07)", border:"1px solid rgba(230,57,70,.4)", color:"#e63946", borderRadius:12, padding:"14px 20px", cursor:"pointer", fontSize:15, fontWeight:600, textAlign:"left", display:"flex", alignItems:"center", gap:12 }}>
                          <span style={{ fontSize:20 }}>⬇️</span>
                          <div>
                            <div>Bury It</div>
                            <div style={{ fontSize:12, color:"rgba(230,57,70,.6)", fontWeight:400 }}>Add a {label.toLowerCase()} to push this song to the back</div>
                          </div>
                        </button>
                      )}
                      <button onClick={() => setSelectedSong(null)}
                        style={{ background:"transparent", border:"1px solid var(--border)", color:"var(--muted)", borderRadius:10, padding:"10px 20px", cursor:"pointer", fontSize:14 }}>
                        Cancel
                      </button>
                    </div>
                  ) : (
                    <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                      <div style={{ background: actionType==="up"?"rgba(109,193,53,.08)":"rgba(230,57,70,.08)", border:`1px solid ${actionType==="up"?"var(--green)":"rgba(230,57,70,.4)"}`, borderRadius:10, padding:"10px 14px", fontSize:13, color:"var(--muted)" }}>
                        {actionType==="up" ? `⬆️ Bumping up: ${selectedSong.song}` : `⬇️ Burying: ${selectedSong.song}`}
                      </div>
                      <div>
                        <label style={{ display:"block", fontSize:11, letterSpacing:2, color:"var(--muted)", textTransform:"uppercase", marginBottom:6, fontFamily:"var(--font-mono)" }}>Your Name *</label>
                        <input value={actionName} onChange={e => setActionName(e.target.value)} placeholder="Taylor"
                          style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:8, padding:"12px 16px", color:"var(--text)", fontSize:16, width:"100%", outline:"none", fontFamily:"'DM Sans', sans-serif" }} />
                      </div>
                      <div>
                        <label style={{ display:"block", fontSize:11, letterSpacing:2, color:"var(--muted)", textTransform:"uppercase", marginBottom:6, fontFamily:"var(--font-mono)" }}>{label} Amount *</label>
                        <div style={{ display:"flex", gap:8, marginBottom:8 }}>
                          {[2,5,10].map(p => (
                            <button key={p} onClick={() => setActionTip(String(p))}
                              style={{ flex:1, padding:"10px 0", borderRadius:8, cursor:"pointer", fontSize:14, fontWeight:600, border:`1px solid ${parseFloat(actionTip)===p?"var(--green)":"var(--border)"}`, background:parseFloat(actionTip)===p?"rgba(109,193,53,.15)":"var(--surface)", color:parseFloat(actionTip)===p?"var(--green)":"var(--muted)" }}>
                              ${p}
                            </button>
                          ))}
                        </div>
                        <input type="number" min="1" step="0.50" value={actionTip} onChange={e => setActionTip(e.target.value)}
                          placeholder="or enter amount"
                          style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:8, padding:"12px 16px", color:"var(--text)", fontSize:15, width:"100%", outline:"none", fontFamily:"'DM Sans', sans-serif" }} />
                      </div>
                      <div style={{ display:"flex", gap:10 }}>
                        <button onClick={() => setActionType(null)}
                          style={{ flex:1, background:"transparent", border:"1px solid var(--border)", color:"var(--muted)", borderRadius:10, padding:12, cursor:"pointer", fontSize:14 }}>← Back</button>
                        <button onClick={handleBumpAction} disabled={actionSaving || !actionName.trim() || (parseFloat(actionTip)||0)<=0}
                          style={{ flex:2, background:actionType==="up"?"var(--green)":"var(--red)", color:"#fff", border:"none", borderRadius:10, padding:12, cursor:"pointer", fontSize:15, fontWeight:700, opacity:(actionSaving||!actionName.trim()||(parseFloat(actionTip)||0)<=0)?0.5:1 }}>
                          {actionSaving ? "Saving…" : actionType==="up" ? `⬆️ Bump Up` : `⬇️ Bury It`}
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── Display View ───────────────────────────────────────────────────────────

              {Array(3).fill(
                "🎵 SCAN THE QR CODE TO REQUEST A SONG  ·  TIP THE DJ TO JUMP THE LINE  ·  INNER GROOVE BREWING  ·  " +
                (recentlyPlayed && recentlyPlayed.length > 0
                  ? "JUST PLAYED: " + recentlyPlayed.slice(0,5).map(s => s.song.toUpperCase() + (s.artist ? " (" + s.artist + ")" : "")).join("  ·  ") + "  ·  "

          </div>

    // ── Admin View ─────────────────────────────────────────────────────────────
    function AdminView({ queue, onRefresh, settings, onSettingsChange, onRecentlyPlayed }) {
      const [pin, setPin]           = useState("");
      const [authed, setAuthed]     = useState(false);
      const [confirmDlg, setConfirmDlg] = useState(null);
      const [played, setPlayed]     = useState([]);
      const [toast, setToast]       = useState(null);
      const [showPlayed, setShowPlayed] = useState(false);
      const [localQueue, setLocalQueue] = useState(queue);
      const [dragIdx, setDragIdx]   = useState(null);
      const [dragOver, setDragOver] = useState(null);
      const [activeTab, setActiveTab] = useState("queue");
      const ADMIN_PIN = "1234";
      const TABS = [
        { id:"queue",    label:"🎵 Queue"    },
        { id:"settings", label:"⚙️ Settings"  },
        { id:"payments", label:"💳 Payments"  },
      ];

      // Keep localQueue in sync with incoming queue unless DJ is dragging
      useEffect(() => {
        if (dragIdx === null) setLocalQueue(queue);
      }, [queue, dragIdx]);

      async function handleDrop(toIdx) {
        if (dragIdx === null || dragIdx === toIdx) return;
        const reordered = [...localQueue];
        const [moved] = reordered.splice(dragIdx, 1);
        reordered.splice(toIdx, 0, moved);
        setLocalQueue(reordered);
        setDragIdx(null);
        setDragOver(null);
        // Persist new order to Supabase
        await Promise.all(
          reordered.map((s, i) => sb.from("dj_queue").update({ order_index: i }).eq("id", s.id))
        );
        await onRefresh();
      }

      function showToast(entry) {
        setToast(entry);
        setTimeout(() => setToast(t => t && t.id === entry.id ? null : t), 5000);
      }

      async function markPlayed(entry) {
        await sb.from("dj_queue").delete().eq("id", entry.id);
        setPlayed(p => [entry, ...p]);
        onRecentlyPlayed(entry);
        await onRefresh();
        showToast(entry);
      }

      async function restoreEntry(entry) {
        await sb.from("dj_queue").insert({
          id: entry.id, song: entry.song, artist: entry.artist,
          name: entry.name, tip: entry.tip, bumped: entry.bumped,
        });
        setPlayed(p => p.filter(x => x.id !== entry.id));
        setToast(null);
        await onRefresh();
      }

      async function removeEntry(id) {
        await sb.from("dj_queue").delete().eq("id", id);
        setConfirmDlg(null);
        await onRefresh();
      }

      async function clearAll() {
        await sb.from("dj_queue").delete().neq("id", "");
        setConfirmDlg(null);
        await onRefresh();
      }

      if (!authed) return (
        <div style={{ minHeight:"100vh", background:"var(--bg)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:16 }}>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontFamily:"var(--font-display)", fontSize:48, color:"var(--green)", letterSpacing:5, animation:"pulse-green 3s ease-in-out infinite" }}>INNER GROOVE</div>
            <div style={{ fontFamily:"var(--font-display)", fontSize:26, color:"var(--green-dim)", letterSpacing:8 }}>BREWING</div>
          </div>
          <div style={{ fontFamily:"var(--font-display)", fontSize:36, color:"var(--white)", letterSpacing:4, marginTop:8 }}>DJ CONSOLE</div>
          <div style={{ color:"var(--muted)", fontFamily:"var(--font-mono)", fontSize:13, marginBottom:8 }}>Enter PIN to continue</div>
          <input type="password" value={pin} onChange={e => setPin(e.target.value)}
            onKeyDown={e => e.key==="Enter" && (pin===ADMIN_PIN?setAuthed(true):setPin(""))}
            placeholder="••••"
            style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:8, padding:"14px 20px", color:"var(--text)", fontSize:24, textAlign:"center", width:200, outline:"none", fontFamily:"var(--font-mono)", letterSpacing:6 }} />
          <button onClick={() => pin===ADMIN_PIN?setAuthed(true):setPin("")}
            style={{ background:"var(--green)", color:"#0d0d0d", border:"none", borderRadius:8, padding:"12px 32px", cursor:"pointer", fontWeight:700, fontSize:15 }}>
            Enter
          </button>
        </div>
      );

      return (
        <div style={{ minHeight:"100vh", background:"var(--bg)", paddingBottom:80 }}>

          {/* Confirmation Dialog */}
          {confirmDlg && (
            <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.75)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:9999, padding:24 }}>
              <div style={{ background:"var(--card)", border:"1px solid var(--border)", borderRadius:16, padding:32, maxWidth:380, width:"100%", textAlign:"center", animation:"slide-up .2s ease" }}>
                <div style={{ fontSize:40, marginBottom:12 }}>{confirmDlg.action==="clear" ? "🗑️" : "⚠️"}</div>
                <div style={{ fontFamily:"var(--font-display)", fontSize:28, color:"var(--white)", letterSpacing:2, marginBottom:8 }}>
                  {confirmDlg.action==="clear" ? "CLEAR ALL?" : "MARK AS PLAYED?"}
                </div>
                <div style={{ color:"var(--muted)", fontSize:14, marginBottom:24, lineHeight:1.5 }}>
                  {confirmDlg.action==="clear"
                    ? "This will remove every song from the queue."
                    : <span>Remove <strong style={{ color:"var(--text)" }}>{confirmDlg.song}</strong> from the queue?</span>}
                </div>
                <div style={{ display:"flex", gap:12 }}>
                  <button onClick={() => setConfirmDlg(null)}
                    style={{ flex:1, background:"transparent", border:"1px solid var(--border)", color:"var(--muted)", borderRadius:10, padding:14, cursor:"pointer", fontSize:15 }}>
                    Cancel
                  </button>
                  <button onClick={() => confirmDlg.action==="clear" ? clearAll() : removeEntry(confirmDlg.id)}
                    style={{ flex:1, background:confirmDlg.action==="clear"?"var(--red)":"var(--green)", color:confirmDlg.action==="clear"?"#fff":"#0d0d0d", border:"none", borderRadius:10, padding:14, cursor:"pointer", fontSize:15, fontWeight:700 }}>
                    {confirmDlg.action==="clear" ? "Yes, Clear All" : "Yes, Remove"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Undo Toast */}
          {toast && (
            <div style={{
              position:"fixed", bottom:80, left:"50%", transform:"translateX(-50%)",
              background:"var(--card)", border:"1px solid var(--green)", borderRadius:12,
              padding:"12px 20px", display:"flex", alignItems:"center", gap:16,
              zIndex:9998, boxShadow:"0 4px 24px rgba(0,0,0,.5)", animation:"slide-up .3s ease", whiteSpace:"nowrap",
            }}>
              <span style={{ fontSize:13, color:"var(--text)" }}>✓ <strong>{toast.song}</strong> marked as played</span>
              <button onClick={() => restoreEntry(toast)}
                style={{ background:"var(--green)", color:"#0d0d0d", border:"none", borderRadius:6, padding:"4px 14px", cursor:"pointer", fontSize:13, fontWeight:700 }}>
                UNDO
              </button>
            </div>
          )}

          {/* Header */}
          <div style={{ background:"var(--surface)", borderBottom:"1px solid var(--border)", padding:"20px 24px 0" }}>
            <div style={{ maxWidth:640, margin:"0 auto" }}>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20 }}>
                <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                  <div>
                    <div style={{ fontFamily:"var(--font-display)", fontSize:16, color:"var(--green)", letterSpacing:3 }}>INNER GROOVE</div>
                    <div style={{ fontFamily:"var(--font-display)", fontSize:12, color:"var(--green-dim)", letterSpacing:3 }}>BREWING</div>
                  </div>
                  <div style={{ fontFamily:"var(--font-display)", fontSize:32, color:"var(--white)", letterSpacing:4 }}>DJ CONSOLE</div>
                </div>
                {activeTab === "queue" && (
                  <button onClick={() => setConfirmDlg({ action:"clear" })}
                    style={{ background:"rgba(230,57,70,.1)", border:"1px solid var(--red)", color:"var(--red)", borderRadius:8, padding:"8px 16px", cursor:"pointer", fontSize:12, fontFamily:"var(--font-mono)" }}>
                    CLEAR ALL
                  </button>
                )}
              </div>
              {/* Tab bar */}
              <div style={{ display:"flex", gap:2 }}>
                {TABS.map(t => (
                  <button key={t.id} onClick={() => setActiveTab(t.id)}
                    style={{
                      flex:1, padding:"10px 8px", border:"none", cursor:"pointer",
                      fontFamily:"var(--font-mono)", fontSize:11, letterSpacing:1, fontWeight:600,
                      background:"transparent",
                      color: activeTab===t.id ? "var(--green)" : "var(--muted)",
                      borderBottom: activeTab===t.id ? "2px solid var(--green)" : "2px solid transparent",
                      transition:"all .2s",
                    }}>
                    {t.label}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* Tab Content */}
          <div style={{ maxWidth:640, margin:"0 auto", padding:"24px 24px 32px" }}>

            {/* ── QUEUE TAB ── */}
            {activeTab === "queue" && (
              <div>
                {queue.length === 0 ? (
                  <div style={{ textAlign:"center", color:"var(--muted)", padding:"60px 0", fontFamily:"var(--font-mono)" }}>Queue is empty</div>
                ) : (
                  <div style={{ display:"flex", flexDirection:"column", gap:10, marginBottom:32 }}>
                    {localQueue.map((s,i) => (
                      <div key={s.id}
                        draggable
                        onDragStart={() => setDragIdx(i)}
                        onDragOver={e => { e.preventDefault(); setDragOver(i); }}
                        onDrop={() => handleDrop(i)}
                        onDragEnd={() => { setDragIdx(null); setDragOver(null); }}
                        style={{
                          background:"var(--card)",
                          border:`1px solid ${dragOver===i && dragIdx!==i?"var(--green)":s.bumped?"rgba(109,193,53,.4)":"var(--border)"}`,
                          borderRadius:12, padding:"16px 20px", display:"flex", alignItems:"center", gap:16,
                          cursor:"grab", opacity: dragIdx===i ? 0.4 : 1,
                          transition:"border-color .15s, opacity .15s",
                          boxShadow: dragOver===i && dragIdx!==i ? "0 0 0 2px var(--green)" : "none",
                        }}>
                        <span style={{ color:"var(--muted)", fontSize:18, userSelect:"none" }}>⠿</span>
                        <span style={{ fontFamily:"var(--font-mono)", fontSize:18, color:i===0?"var(--green)":"var(--muted)", minWidth:28 }}>#{i+1}</span>
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ fontWeight:600, fontSize:16, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{s.song}</div>
                          <div style={{ fontSize:12, color:"var(--muted)", marginTop:2 }}>
                            {s.artist && `${s.artist} · `}{s.name}
                            {s.tip > 0 && <span style={{ color:"var(--gold)", marginLeft:8 }}>💰 ${s.tip.toFixed(2)}{s.bumped?" (BUMP)":""}</span>}
                          </div>
                          {s.message && <div style={{ fontSize:12, color:"var(--green-dim)", marginTop:4, fontStyle:"italic", background:"rgba(109,193,53,.06)", borderRadius:4, padding:"3px 8px", display:"inline-block" }}>💌 {s.message}</div>}
                        </div>
                        <div style={{ display:"flex", gap:8 }}>
                          <button onClick={() => markPlayed(s)}
                            style={{ background:"rgba(109,193,53,.15)", border:"1px solid var(--green)", color:"var(--green)", borderRadius:6, padding:"6px 14px", cursor:"pointer", fontSize:12, fontFamily:"var(--font-mono)" }}>
                            ✓ PLAYED
                          </button>
                          <button onClick={() => setConfirmDlg({ id:s.id, song:s.song, action:"remove" })}
                            style={{ background:"transparent", border:"1px solid var(--border)", color:"var(--muted)", borderRadius:6, padding:"6px 10px", cursor:"pointer", fontSize:12 }}>
                            ✕
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* Recently Played */}
                {played.length > 0 && (
                  <div>
                    <button onClick={() => setShowPlayed(p => !p)}
                      style={{ background:"transparent", border:"none", color:"var(--muted)", cursor:"pointer", fontFamily:"var(--font-mono)", fontSize:12, letterSpacing:2, display:"flex", alignItems:"center", gap:8, marginBottom:12 }}>
                      {showPlayed ? "▼" : "▶"} RECENTLY PLAYED ({played.length})
                    </button>
                    {showPlayed && (
                      <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                        {played.map(s => (
                          <div key={s.id} style={{
                            background:"var(--surface)", border:"1px solid var(--border)",
                            borderRadius:10, padding:"12px 16px", display:"flex", alignItems:"center", gap:12, opacity:.7,
                          }}>
                            <span style={{ fontSize:14, color:"var(--muted)" }}>✓</span>
                            <div style={{ flex:1, minWidth:0 }}>
                              <div style={{ fontSize:14, fontWeight:500, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", textDecoration:"line-through", color:"var(--muted)" }}>{s.song}</div>
                              <div style={{ fontSize:11, color:"var(--muted)", marginTop:1 }}>{s.name}{s.artist ? ` · ${s.artist}` : ""}</div>
                            </div>
                            <button onClick={() => restoreEntry(s)}
                              style={{ background:"transparent", border:"1px solid var(--border)", color:"var(--muted)", borderRadius:6, padding:"4px 12px", cursor:"pointer", fontSize:11, fontFamily:"var(--font-mono)", whiteSpace:"nowrap" }}>
                              ↩ RESTORE
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* ── SETTINGS TAB ── */}
            {activeTab === "settings" && (
              <div style={{ display:"flex", flexDirection:"column", gap:12 }}>

                {/* Charity Mode */}
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                  <div>
                    <div style={{ fontSize:14, fontWeight:600, color:settings.charityMode?"var(--green)":"var(--text)" }}>🎗️ Charity Mode</div>
                    <div style={{ fontSize:11, color:"var(--muted)", marginTop:2 }}>All requests require a donation</div>
                  </div>
                  <div onClick={() => onSettingsChange(s => ({ ...s, charityMode: !s.charityMode }))}
                    style={{ width:44, height:24, borderRadius:12, background:settings.charityMode?"var(--green)":"var(--border)", cursor:"pointer", position:"relative", transition:"background .2s" }}>
                    <div style={{ position:"absolute", top:3, left:settings.charityMode?22:3, width:18, height:18, borderRadius:"50%", background:"#fff", transition:"left .2s" }} />
                  </div>
                </div>

                {settings.charityMode && (
                  <div style={{ display:"flex", flexDirection:"column", gap:8, padding:"12px 16px", background:"rgba(245,200,66,.06)", border:"1px solid rgba(245,200,66,.3)", borderRadius:10 }}>
                    <input value={settings.charityName||""} onChange={e => onSettingsChange(s => ({ ...s, charityName: e.target.value }))}
                      placeholder="Charity name (e.g. Pittsburgh Food Bank)"
                      style={{ background:"var(--card)", border:"1px solid var(--border)", borderRadius:8, padding:"8px 12px", color:"var(--text)", fontSize:14, width:"100%", outline:"none", fontFamily:"'DM Sans', sans-serif" }} />
                    <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                      <div style={{ fontFamily:"var(--font-mono)", fontSize:14, color:"var(--gold)", fontWeight:700 }}>💛 ${(settings.charityRaised||0).toFixed(2)} raised tonight</div>
                      <button onClick={() => { if(confirm("Reset charity total to $0?")) onSettingsChange(s => ({ ...s, charityRaised: 0 })); }}
                        style={{ background:"transparent", border:"1px solid var(--border)", color:"var(--muted)", borderRadius:6, padding:"4px 12px", cursor:"pointer", fontSize:12, fontFamily:"var(--font-mono)" }}>
                        RESET
                      </button>
                    </div>
                  </div>
                )}

                <div style={{ height:1, background:"var(--border)", margin:"4px 0" }} />

                {!settings.charityMode && (
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                    <div style={{ fontSize:14, color:"var(--text)" }}>💰 Call it</div>
                    <div style={{ display:"flex", gap:6 }}>
                      {["Tip","Donation"].map(opt => (
                        <button key={opt} onClick={() => onSettingsChange(s => ({ ...s, donationLabel: opt }))}
                          style={{ padding:"4px 14px", borderRadius:20, border:`1px solid ${settings.donationLabel===opt?"var(--green)":"var(--border)"}`, background:settings.donationLabel===opt?"rgba(109,193,53,.15)":"transparent", color:settings.donationLabel===opt?"var(--green)":"var(--muted)", cursor:"pointer", fontSize:13, fontWeight:600 }}>
                          {opt}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {!settings.charityMode && (
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                    <div>
                      <div style={{ fontSize:14, color:"var(--text)" }}>🆓 Allow free requests</div>
                      <div style={{ fontSize:11, color:"var(--muted)", marginTop:2 }}>Patrons can submit without tipping</div>
                    </div>
                    <div onClick={() => onSettingsChange(s => ({ ...s, allowFree: !s.allowFree }))}
                      style={{ width:44, height:24, borderRadius:12, background:settings.allowFree?"var(--green)":"var(--border)", cursor:"pointer", position:"relative", transition:"background .2s" }}>
                      <div style={{ position:"absolute", top:3, left:settings.allowFree?22:3, width:18, height:18, borderRadius:"50%", background:"#fff", transition:"left .2s" }} />
                    </div>
                  </div>
                )}

                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                  <div>
                    <div style={{ fontSize:14, color:"var(--text)" }}>⬆️ Bump Up</div>
                    <div style={{ fontSize:11, color:"var(--muted)", marginTop:2 }}>Patrons can tip to jump the line</div>
                  </div>
                  <div onClick={() => onSettingsChange(s => ({ ...s, bumpUpEnabled: !s.bumpUpEnabled }))}
                    style={{ width:44, height:24, borderRadius:12, background:settings.bumpUpEnabled?"var(--green)":"var(--border)", cursor:"pointer", position:"relative", transition:"background .2s" }}>
                    <div style={{ position:"absolute", top:3, left:settings.bumpUpEnabled?22:3, width:18, height:18, borderRadius:"50%", background:"#fff", transition:"left .2s" }} />
                  </div>
                </div>

                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                  <div>
                    <div style={{ fontSize:14, color:"var(--text)" }}>⬇️ Bump Down</div>
                    <div style={{ fontSize:11, color:"var(--muted)", marginTop:2 }}>Patrons can tip to bury a song</div>
                  </div>
                  <div onClick={() => onSettingsChange(s => ({ ...s, bumpDownEnabled: !s.bumpDownEnabled }))}
                    style={{ width:44, height:24, borderRadius:12, background:settings.bumpDownEnabled?"var(--green)":"var(--border)", cursor:"pointer", position:"relative", transition:"background .2s" }}>
                    <div style={{ position:"absolute", top:3, left:settings.bumpDownEnabled?22:3, width:18, height:18, borderRadius:"50%", background:"#fff", transition:"left .2s" }} />
                  </div>
                </div>

                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                  <div>
                    <div style={{ fontSize:14, color:"var(--text)" }}>🔢 Request Limit per Person</div>
                    <div style={{ fontSize:11, color:"var(--muted)", marginTop:2 }}>0 = unlimited</div>
                  </div>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <button onClick={() => onSettingsChange(s => ({ ...s, requestCap: Math.max(0, (s.requestCap||0) - 1) }))}
                      style={{ width:28, height:28, borderRadius:6, border:"1px solid var(--border)", background:"var(--card)", color:"var(--text)", cursor:"pointer", fontSize:16, fontWeight:700 }}>−</button>
                    <span style={{ fontFamily:"var(--font-mono)", fontSize:16, color:"var(--green)", minWidth:24, textAlign:"center" }}>{settings.requestCap||0}</span>
                    <button onClick={() => onSettingsChange(s => ({ ...s, requestCap: (s.requestCap||0) + 1 }))}
                      style={{ width:28, height:28, borderRadius:6, border:"1px solid var(--border)", background:"var(--card)", color:"var(--text)", cursor:"pointer", fontSize:16, fontWeight:700 }}>+</button>
                  </div>
                </div>

              </div>
            )}

            {/* ── PAYMENTS TAB ── */}
            {activeTab === "payments" && (
              <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
                {[
                  { key:"venmo",   label:"💸 Venmo",         placeholder:"@YourHandle" },
                  { key:"paypal",  label:"🅿️ PayPal",         placeholder:"paypal.me/YourName" },
                  { key:"cashapp", label:"💚 Cash App",        placeholder:"$YourCashtag" },
                  { key:"zelle",   label:"⚡ Zelle",           placeholder:"phone or email" },
                  { key:"cash",    label:"🫙 Cash (tip jar)",  placeholder:null },
                ].map(({ key, label, placeholder }) => (
                  <div key={key} style={{ background:"var(--card)", border:"1px solid var(--border)", borderRadius:12, padding:"14px 18px" }}>
                    <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom: placeholder && settings.paymentMethods[key]?.enabled ? 10 : 0 }}>
                      <div style={{ fontSize:15, fontWeight:600, color:settings.paymentMethods[key]?.enabled?"var(--green)":"var(--text)" }}>{label}</div>
                      <div onClick={() => onSettingsChange(s => ({ ...s, paymentMethods: { ...s.paymentMethods, [key]: { ...s.paymentMethods[key], enabled: !s.paymentMethods[key]?.enabled }}}))}
                        style={{ width:44, height:24, borderRadius:12, background:settings.paymentMethods[key]?.enabled?"var(--green)":"var(--border)", cursor:"pointer", position:"relative", transition:"background .2s", flexShrink:0 }}>
                        <div style={{ position:"absolute", top:3, left:settings.paymentMethods[key]?.enabled?22:3, width:18, height:18, borderRadius:"50%", background:"#fff", transition:"left .2s" }} />
                      </div>
                    </div>
                    {placeholder && settings.paymentMethods[key]?.enabled && (
                      <input
                        value={settings.paymentMethods[key]?.handle || ""}
                        onChange={e => onSettingsChange(s => ({ ...s, paymentMethods: { ...s.paymentMethods, [key]: { ...s.paymentMethods[key], handle: e.target.value }}}))}
                        placeholder={placeholder}
                        style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:8, padding:"8px 12px", color:"var(--text)", fontSize:14, width:"100%", outline:"none", fontFamily:"'DM Sans', sans-serif" }}
                      />
                    )}
                  </div>
                ))}
              </div>
            )}

          </div>
        </div>
      );
    }

    // ── Root App ───────────────────────────────────────────────────────────────
    function App() {
      const [queue, setQueue]       = useState([]);
      const [rawQueue, setRawQueue] = useState([]);
      const [leaderboard, setLeaderboard] = useState([]);
      const [recentlyPlayed, setRecentlyPlayed] = useState([]);
      const [loaded, setLoaded]     = useState(false);
      const [view, setView]         = useState("patron");
      const [settings, setSettingsState] = useState({
        charityMode: false,
        charityName: "",
        charityRaised: 0,
        donationLabel: "Tip",
        allowFree: true,
        bumpUpEnabled: true,
        bumpDownEnabled: true,
        requestCap: 0,
        paymentMethods: {
          venmo:   { enabled: true,  handle: "@InnerGrooveBrewing" },
          paypal:  { enabled: false, handle: "" },
          cashapp: { enabled: false, handle: "" },
          zelle:   { enabled: false, handle: "" },
          cash:    { enabled: true,  handle: "" },
        },
      });

      function setSettings(updater) {
        setSettingsState(prev => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          persistSettings(next);
          return next;
        });
      }

      const DEFAULT_SETTINGS = {
        charityMode: false,
        charityName: "",
        charityRaised: 0,
        donationLabel: "Tip",
        allowFree: true,
        bumpUpEnabled: true,
        bumpDownEnabled: true,
        requestCap: 0,
        paymentMethods: {
          venmo:   { enabled: true,  handle: "@InnerGrooveBrewing" },
          paypal:  { enabled: false, handle: "" },
          cashapp: { enabled: false, handle: "" },
          zelle:   { enabled: false, handle: "" },
          cash:    { enabled: true,  handle: "" },
        },
      };

      async function fetchLeaderboard() {
        const { data } = await sb.from("donations_log").select("donor_name, amount");
        if (!data) return [];
        const totals = {};
        data.forEach(({ donor_name, amount }) => {
          if (!totals[donor_name]) totals[donor_name] = { donor_name, total: 0, count: 0 };
          totals[donor_name].total += parseFloat(amount) || 0;
          totals[donor_name].count += 1;
        });
        return Object.values(totals).sort((a, b) => b.total - a.total).slice(0, 10);
      }

      const refresh = useCallback(async () => {
        const [q, lb, savedSettings] = await Promise.all([fetchQueue(), fetchLeaderboard(), fetchSettings()]);
        setQueue(sortQueue(q));
        setRawQueue(q);
        setLeaderboard(lb);
        if (savedSettings && Object.keys(savedSettings).length > 0) {
          setSettings(s => ({ ...DEFAULT_SETTINGS, ...s, ...savedSettings,
            paymentMethods: { ...DEFAULT_SETTINGS.paymentMethods, ...(savedSettings.paymentMethods || {}) }
          }));
        }
      }, []);

      useEffect(() => {
        refresh().then(() => setLoaded(true));
      }, []);

      // Realtime subscription
      useEffect(() => {
        const channel = sb.channel("dj_queue_changes")
          .on("postgres_changes", { event:"*", schema:"public", table:"dj_queue" }, () => refresh())
          .subscribe();
        return () => sb.removeChannel(channel);
      }, [refresh]);

      if (!loaded) return (
        <div style={{ minHeight:"100vh", background:"var(--bg)", display:"flex", alignItems:"center", justifyContent:"center" }}>
          <div style={{ width:40, height:40, border:"3px solid var(--border)", borderTopColor:"var(--green)", borderRadius:"50%", animation:"spin 1s linear infinite" }} />
        </div>
      );

      return (
        <div style={{ minHeight:"100vh", background:"var(--bg)" }}>
          <div style={{
            position:"fixed", bottom:16, left:"50%", transform:"translateX(-50%)",
            background:"rgba(13,13,13,.95)", border:"1px solid var(--border)",
            borderRadius:100, padding:"6px 8px", display:"flex", gap:4, zIndex:999,
            backdropFilter:"blur(10px)", boxShadow:"0 4px 24px rgba(0,0,0,.5)",
          }}>
            {[["patron","📱 Patron"],["display","📺 Display"],["admin","🎛️ Admin"]].map(([v,label]) => (
              <button key={v} onClick={() => setView(v)}
                style={{
                  background:view===v?"var(--green)":"transparent",
                  color:view===v?"#0d0d0d":"var(--muted)",
                  border:"none", borderRadius:100, padding:"8px 18px",
                  cursor:"pointer", fontSize:13, fontWeight:600, transition:"all .2s",
                }}>{label}</button>
            ))}
          </div>
          {view==="patron"  && <PatronView  queue={queue} onRefresh={refresh} settings={settings} onSettingsChange={setSettings} />}
          {view==="display" && <DisplayView queue={queue} leaderboard={leaderboard} settings={settings} recentlyPlayed={recentlyPlayed} />}
          {view==="admin"   && <AdminView   queue={sortQueue(rawQueue)} onRefresh={refresh} settings={settings} onSettingsChange={setSettings} onRecentlyPlayed={entry => setRecentlyPlayed(p => [entry, ...p].slice(0,10))} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
